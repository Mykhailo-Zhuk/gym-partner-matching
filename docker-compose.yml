services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gymbros
      POSTGRES_PASSWORD: gymbros
      POSTGRES_DB: gymbros
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gymbros"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: gymbros
      MINIO_ROOT_PASSWORD: gymbros123
    ports:
      - "9100:9000"
      - "9101:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
