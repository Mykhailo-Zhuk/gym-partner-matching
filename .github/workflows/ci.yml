name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gymbros
          POSTGRES_PASSWORD: gymbros
          POSTGRES_DB: gymbros
        ports: ['5433:5432']
        options: --health-cmd="pg_isready -U gymbros" --health-interval=5s --health-retries=10
      redis:
        image: redis:7-alpine
        ports: ['6380:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: pnpm exec prisma generate
      - run: cp .env.example .env
      - run: pnpm lint && pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - run: pnpm test:e2e

  admin-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter admin build

  # Validates the staging/production images build on every PR
  # (apps/api/Dockerfile, apps/admin/Dockerfile — build context is the repo root).
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build api image
        run: docker build -f apps/api/Dockerfile -t gymbros-api:ci .
      - name: Build admin image
        run: docker build -f apps/admin/Dockerfile -t gymbros-admin:ci .
