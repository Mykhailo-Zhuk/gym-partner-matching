# GymBrosUK admin panel — nginx config.
# Serves the SPA and proxies the API namespaces same-origin (like the vite dev proxy).
# ONLY the namespaces the admin panel actually calls are proxied: the SPA owns
# /users/:id (react-router), while /users, /matches, /groups, /referrals are
# mobile-only API routes and must resolve to the SPA fallback.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # API namespaces used by the admin panel (auth, admin) + health probe
  location ~ ^/(auth|admin|health)(/|$) {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 10m;
  }

  # SPA: static assets first, then index.html for client-side routes
  location / {
    try_files $uri $uri/ /index.html;
  }
}